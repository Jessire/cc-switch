name: Build Windows EXE

run-name: Build Windows EXE at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-x64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-x64-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Build release EXE
        run: pnpm tauri build --no-bundle

      - name: Prepare artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item src-tauri/target/release/cc-switch.exe artifact/CC-Switch-Custom.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CC-Switch-Custom-Windows-x64
          path: artifact/CC-Switch-Custom.exe
          if-no-files-found: error
          retention-days: 30
